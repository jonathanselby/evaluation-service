name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build -o ./bin/evalgate ./cmd/evalgate
      - name: Version contract
        run: test "$(./bin/evalgate -version)" = "evalgate 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/evalgate-linux-arm64 ./cmd/evalgate
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/evalgate -suite examples/bafflewick/suite.json -results examples/bafflewick/results.json)
          echo "$out" | grep -q '"passed":true'
          echo "$out" | grep -q '"score":1'
